spring.application.name=data-processing-service
server.port=${PORT:8080}

# Defaults match the postgres service in docker-compose.yml; override with SPRING_DATASOURCE_* env vars
spring.datasource.url=jdbc:postgresql://localhost:5432/data_processing
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Records per page of GET /records when the request has no limit, and the largest limit a request may ask for
records.query.default-limit=100
records.query.max-limit=1000

# Kafka; defaults match the kafka service in docker-compose.yml, override with SPRING_KAFKA_* env vars
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=data-processing-service
spring.kafka.consumer.auto-offset-reset=earliest
# Send each message right away instead of waiting up to 5 ms (the Kafka 4 default) to fill a batch: the outbox relay
# waits for every message's confirmation before sending the next, so waiting would cap it at ~130 messages per second
spring.kafka.producer.properties.linger.ms=0
# How long Kafka keeps retrying a send before it gives up: its default, set here because outbox.relay.send-timeout
# must be longer
spring.kafka.producer.properties.delivery.timeout.ms=120000

records.kafka.topic=records
records.kafka.dead-letter-topic=records-dlt
records.kafka.retry.interval=1s
records.kafka.retry.max-retries=3

# Events sent to the Notification service after a record is processed
records.notifications.topic=record-notifications

# Alerts sent to the alerting service when a processed record's value (regardless of type) is above the threshold
# for its unit. Units match case-insensitively; units without a threshold never alert.
# Bracket notation keeps the unit's case; env var form: RECORDS_ALERTS_THRESHOLDS_EUR=10000
records.alerts.topic=record-alerts
records.alerts.thresholds[EUR]=10000
records.alerts.thresholds[kg]=1000

# Transactional outbox relay: publishes stored events to Kafka in batches of batch-size, each in its own transaction.
# While batches come back full the next one starts right away; once the outbox is drained it waits interval.
outbox.relay.interval=1s
outbox.relay.batch-size=100
# Longer than delivery.timeout.ms above, so by then Kafka has delivered the message or given up on it. With a shorter
# wait, a message the relay gave up on could still arrive later, after the next run had already sent it again.
outbox.relay.send-timeout=130s
